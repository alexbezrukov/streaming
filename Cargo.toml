[package]
name = "live-streaming-cdn"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Concurrency
dashmap = "5.5"
parking_lot = "0.12"

# Data structures
bytes = "1.5"
lru = "0.12"

# Crypto & hashing
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"

# Redis
redis = { version = "0.24", features = ["tokio-comp", "cluster", "streams", "connection-manager"] }

# Unique IDs
uuid = { version = "1.6", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async traits
async-trait = "0.1"

# Configuration
dotenvy = "0.15"

# CPU detection for transcoder
num_cpus = "1.16"

# Random number generation
rand = "0.8"
reqwest = { version = "0.13.1", features = ["json"] }

[dev-dependencies]
# Testing
tokio-test = "0.4"
criterion = "0.5"

[features]
default = ["transcoder-pool"]
transcoder-pool = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[[bin]]
name = "live-streaming-cdn"
path = "src/main.rs"
